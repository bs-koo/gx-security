# SQIsoft SQL Injection Semgrep ruleset
# 사용: semgrep --config rules/sqli.yml <target>
# 두 스택(spring-modern / jsp-legacy)을 함께 커버한다. 스캐너는 "넓게 후보를 잡고",
# 최종 판정은 SKILL.md 2단계의 AI 검증이 한다(특히 #{} vs ${} 구분, allowlist 존재 여부).

rules:
  # ───────────────────────── jsp-legacy ─────────────────────────

  - id: sqisoft-jsp-statement-string-concat
    languages: [java]
    severity: ERROR
    message: >-
      Statement.executeQuery/executeUpdate에 문자열 연결로 SQL을 조립하고 있습니다.
      사용자 입력(getParameter 등)이 포함되면 SQL Injection이 확정됩니다.
      PreparedStatement와 ? 플레이스홀더로 전환하세요.
    metadata:
      cwe: "CWE-89"
      owasp: "A03:2021"
      stack: jsp-legacy
      confidence: high
    patterns:
      - pattern-either:
          - pattern: |
              $STMT.executeQuery($SQL + $INPUT)
          - pattern: |
              $STMT.executeUpdate($SQL + $INPUT)
          - pattern: |
              $CONN.createStatement().executeQuery($SQL + $INPUT)

  - id: sqisoft-jdbc-string-concat-query
    languages: [java]
    severity: ERROR
    message: >-
      JDBC Connection/Statement에서 문자열 연결로 SQL을 조립하고 있습니다.
      PreparedStatement와 ? 플레이스홀더로 전환하세요.
    metadata:
      cwe: "CWE-89"
      owasp: "A03:2021"
      stack: jsp-legacy
      confidence: needs-context
    patterns:
      - pattern: |
          String $SQL = $PREFIX + $INPUT + $SUFFIX;
          ... $STMT.execute($SQL); ...
      - pattern-not: |
          String $SQL = "..." ;

  - id: sqisoft-mybatis-xml-dollar-interpolation
    languages: [generic]
    severity: ERROR
    paths:
      include:
        - "*.xml"
    message: >-
      MyBatis Mapper XML에서 ${} 구문을 사용하고 있습니다.
      ${}는 SQL 조각을 문자열로 치환하므로 사용자 입력이 들어오면 SQL Injection 위험입니다.
      값 바인딩에는 #{} 로 교체하세요. ORDER BY·컬럼명 동적 삽입이 필요하면
      서비스 레이어에서 허용 목록(allowlist) 검증 후 전달하세요.
    metadata:
      cwe: "CWE-89"
      owasp: "A03:2021"
      stack: jsp-legacy
      confidence: needs-context
    pattern-regex: '\$\{(?!pageContext|contextPath|sessionScope|requestScope\.LoginVo)[^}]+\}'

  # ───────────────────────── spring-modern ─────────────────────────

  - id: sqisoft-spring-jdbctemplate-string-concat
    languages: [java]
    severity: ERROR
    message: >-
      JdbcTemplate.query/queryForObject/update에 문자열 연결로 SQL을 조립하고 있습니다.
      사용자 입력이 포함되면 SQL Injection 위험입니다.
      ? 플레이스홀더와 파라미터 배열을 사용하세요.
    metadata:
      cwe: "CWE-89"
      owasp: "A03:2021"
      stack: spring-modern
      confidence: needs-context
    patterns:
      - pattern-either:
          - pattern: $JDBC.query($SQL + $INPUT, ...)
          - pattern: $JDBC.queryForObject($SQL + $INPUT, ...)
          - pattern: $JDBC.update($SQL + $INPUT, ...)
          - pattern: $JDBC.queryForList($SQL + $INPUT, ...)

  - id: sqisoft-spring-jpa-createquery-string-concat
    languages: [java]
    severity: WARNING
    message: >-
      EntityManager.createQuery/createNativeQuery에 문자열 연결로 JPQL/SQL을 조립하고 있습니다.
      JPQL Injection 또는 SQL Injection 위험입니다.
      setParameter("name", value) 파라미터 바인딩으로 전환하세요.
    metadata:
      cwe: "CWE-89"
      owasp: "A03:2021"
      stack: spring-modern
      confidence: needs-context
    patterns:
      - pattern-either:
          - pattern: $EM.createQuery($Q + $INPUT)
          - pattern: $EM.createNativeQuery($Q + $INPUT)
          - pattern: $EM.createQuery($Q + $INPUT, $CLASS)
          - pattern: $EM.createNativeQuery($Q + $INPUT, $CLASS)

  - id: sqisoft-jdbc-two-line-sql-concat-execute
    languages: [java]
    severity: ERROR
    message: >-
      SQL 문자열을 변수에 문자열 연결로 조립한 뒤 executeQuery/executeUpdate로 실행하고 있습니다.
      사용자 입력이 포함되면 SQL Injection 위험입니다.
      PreparedStatement와 ? 플레이스홀더로 전환하세요.
    metadata:
      cwe: "CWE-89"
      owasp: "A03:2021"
      stack: jsp-legacy
      confidence: needs-context
    patterns:
      - pattern-either:
          - pattern: |
              String $SQL = $A + $INPUT;
              ...
              $STMT.executeQuery($SQL);
          - pattern: |
              String $SQL = $A + $INPUT;
              ...
              $STMT.executeUpdate($SQL);
      - pattern-not: |
          String $SQL = "..." ;

  - id: sqisoft-jdbc-preparestatement-concat
    languages: [java]
    severity: ERROR
    message: >-
      Connection.prepareStatement 인자를 문자열 연결로 조립하고 있습니다.
      PreparedStatement의 이점(바인딩)이 무력화되어 SQL Injection 위험입니다.
      SQL 본문에 ? 플레이스홀더를 두고 setString/setInt로 값을 바인딩하세요.
    metadata:
      cwe: "CWE-89"
      owasp: "A03:2021"
      stack: jsp-legacy
      confidence: needs-context
    patterns:
      - pattern: $CONN.prepareStatement($A + $INPUT)
      - pattern-not: $CONN.prepareStatement("...")

  # MyBatis XML ${}는 sqisoft-mybatis-xml-dollar-interpolation 단일 룰로 커버한다.
  # 과거 spring 룰이 동일 *.xml/${} 를 이중 매칭해 이중 카운트했다(코드리뷰 M6).

  # ───────────────────────── taint 시범 (데이터플로우 추적) ─────────────────────────
  # 위 문법 패턴들은 "getParameter + 문자열연결" 형태만 보아 confidence=needs-context에 머문다
  # (사용자 입력이 실제로 sink에 도달하는지 모름 → 정밀도를 AI 2단계에 위임). 아래 taint 룰은
  # source(사용자 입력)→sink(Statement 실행) 데이터플로우가 실제로 이어질 때만 매치하고,
  # PreparedStatement 바인딩(setString/setInt)을 sanitizer로 걸러 오탐을 줄여 confidence=high로
  # 방출한다. semgrep 전용(grep 폴백은 데이터플로우 미지원) — SQLi 1종 시범 도입.
  # 검증: tests/test_rules.py(파싱)·tests/test_scanner_goldenset.py(재현/정밀도).
  - id: sqisoft-taint-getparameter-to-jdbc-execute
    mode: taint
    languages: [java]
    severity: ERROR
    message: >-
      사용자 입력(request.getParameter 등)이 Statement.executeQuery/executeUpdate/execute에
      데이터플로우로 도달합니다(SQL Injection 확정 근접). PreparedStatement와 ? 플레이스홀더로
      값을 바인딩하세요.
    metadata:
      cwe: "CWE-89"
      owasp: "A03:2021"
      stack: spring-modern
      confidence: high
    pattern-sources:
      - pattern: $REQ.getParameter(...)
    pattern-sinks:
      - pattern: $STMT.executeQuery(...)
      - pattern: $STMT.executeUpdate(...)
      - pattern: $STMT.execute(...)
    pattern-sanitizers:
      - pattern: $PS.setString(...)
      - pattern: $PS.setInt(...)
