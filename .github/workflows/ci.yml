name: CI
on:
  push:
    branches: [main]
  pull_request:
jobs:
  test:
    # 폴백(grep-fallback) 경로 — 항상 green 주 게이트. semgrep 미설치 환경 동작 보장.
    # 크로스플랫폼(ubuntu+windows) 매트릭스 — 경로/인코딩 회귀 방지. 스텝은 크로스플랫폼 유지.
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install deps
        run: pip install requests PyYAML
      - name: Run unittest suite
        run: python -m unittest discover -s tests -p "test_*.py" -v

  semgrep-tests:
    # semgrep 경로 — ubuntu 전용. windows는 PyPI에 semgrep-core 네이티브 휠이 없어(Task 2 실측)
    # 파이썬 패키지는 설치돼도 실제 스캔이 rc=2(Failed to find semgrep-core.exe)로 항상 실패하므로
    # semgrep 검증 대상에서 제외한다. windows의 폴백(grep-fallback) 경로는 test job(windows-latest)이
    # 이미 검증한다. 버전 핀(재현성): FR-4 실측값·룰 동작 드리프트 방지.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install deps (semgrep 핀)
        run: for i in 1 2 3; do pip install -r requirements-dev.txt && break || { [ "$i" -eq 3 ] && exit 1; sleep 5; }; done
        shell: bash
      - name: Run unittest suite (semgrep 경로)
        run: python -m unittest discover -s tests -p "test_*.py" -v
