name: CI
on:
  push:
    branches: [main]
  pull_request:
jobs:
  test:
    env:
      GXSEC_NO_SEMGREP: "1"
      PYTHONUTF8: "1"
      PYTHONDONTWRITEBYTECODE: "1"
    # 폴백(grep-fallback) 경로 — 항상 green 주 게이트. semgrep 미설치 환경 동작 보장.
    # 크로스플랫폼(ubuntu+windows) 매트릭스 — 경로/인코딩 회귀 방지. 스텝은 크로스플랫폼 유지.
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install deps
        run: pip install requests==2.34.2 PyYAML==6.0.3 pytest==8.4.2
      - name: Run regression and release-check suite
        run: python -m pytest -q -p no:cacheprovider

  semgrep-tests:
    # 정밀 엔진의 표준은 고정 Linux bundle. Windows 호스트의 기본 회귀와 분리한다.
    # 과거 1.95.0의 Windows 미가용을 최신 모든 버전의 한계로 일반화하지 않는다.
    #
    # 버전 매트릭스: pinned(requirements-dev.txt, 1.172.0)는 재현성 하드 게이트.
    # latest는 룰 파싱/동작 드리프트 조기경보(continue-on-error 비차단) — 최신 semgrep에서 룰이
    # 깨지는 회귀(예: bare @CrossOrigin이 'Invalid pattern for Java'로 파일 전체를 폴백강등)를
    # CI가 먼저 잡는다. latest 실패는 PR을 막지 않고 로그로 신호한다.
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - semgrep_spec: "-r requirements-dev.txt"   # pinned 1.172.0 — 하드 게이트
            experimental: false
          - semgrep_spec: "requests PyYAML semgrep pytest"    # latest — 비차단 호환성 경보
            experimental: true
    continue-on-error: ${{ matrix.experimental }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install deps (${{ matrix.semgrep_spec }})
        run: for i in 1 2 3; do pip install ${{ matrix.semgrep_spec }} && break || { [ "$i" -eq 3 ] && exit 1; sleep 5; }; done
        shell: bash
      - name: Run unittest suite (semgrep 경로)
        run: python -m pytest -q -p no:cacheprovider
        env:
          GXSEC_NO_SEMGREP: ""
          SEMGREP_SEND_METRICS: "off"
          SEMGREP_ENABLE_VERSION_CHECK: "0"

  bundle:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build hash-locked Linux runtime
        run: docker build --platform linux/amd64 -t gx-security:test .
      - name: Verify installed engine versions without network
        run: >-
          docker run --rm --network none --read-only --cap-drop ALL
          --security-opt no-new-privileges --tmpfs /tmp:rw,nosuid,nodev,size=512m
          gx-security:test doctor --source /workspace --json
      - name: Exercise real offline engines and finding reconciliation
        run: >-
          docker run --rm --network none --read-only --cap-drop ALL
          --security-opt no-new-privileges --tmpfs /tmp:rw,nosuid,nodev,size=1g
          --entrypoint python gx-security:test /opt/gx-security/scripts/smoke-runtime.py
