name: CI
on:
  push:
    branches: [main]
  pull_request:
jobs:
  test:
    # 폴백(grep-fallback) 경로 — 항상 green 주 게이트. semgrep 미설치 환경 동작 보장.
    # 크로스플랫폼(ubuntu+windows) 매트릭스 — 경로/인코딩 회귀 방지. 스텝은 크로스플랫폼 유지.
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install deps
        run: pip install requests PyYAML
      - name: Run unittest suite
        run: python -m unittest discover -s tests -p "test_*.py" -v

  semgrep-tests:
    # semgrep 경로(required on ubuntu, best-effort on windows).
    # 버전 핀(재현성): FR-4 실측값·룰 동작 드리프트 방지.
    # windows는 continue-on-error로 비차단 관측: semgrep==1.95.0은 PyPI에 Windows 네이티브 휠이 없어
    # (Task 2 실측) 설치는 되어도 semgrep-core 미탑재로 `semgrep --version`이 rc=2로 실패한다.
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    continue-on-error: ${{ matrix.os == 'windows-latest' }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install deps (semgrep 핀)
        run: for i in 1 2 3; do pip install -r requirements-dev.txt && break || { [ "$i" -eq 3 ] && exit 1; sleep 5; }; done
        shell: bash
      - name: Run unittest suite (semgrep 경로)
        run: python -m unittest discover -s tests -p "test_*.py" -v
