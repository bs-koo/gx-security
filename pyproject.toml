[build-system]
requires = ["setuptools>=75", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "gx-security"
version = "0.10.3"
description = "Developer-run security checks with traceable release evidence"
requires-python = ">=3.10"
dependencies = ["requests==2.34.2", "PyYAML==6.0.3"]
license = {text = "Proprietary"}

[project.scripts]
gxsec = "gxsec.cli:main"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
